[package]
name = "imageinfo-object-guard-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
imageinfo-recovery-probe = { path = "../0028-recovery-evidence" }
serde_json = "=1.0.152"

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }

[lints.rust]
unsafe_code = "forbid"
