name: Rust foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Check bounded XMP component research
        run: |
          cargo fmt --manifest-path experiments/0081-xmp-model/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0081-xmp-model/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0081-xmp-model/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0081-xmp-model/Cargo.toml
      - name: Check native CR3 to in-memory XMP date adapter
        run: |
          cargo fmt --manifest-path experiments/0104-native-xmp-date-adapter/Cargo.toml --all --check
          cargo clippy --manifest-path experiments/0104-native-xmp-date-adapter/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path experiments/0104-native-xmp-date-adapter/Cargo.toml --locked
          cargo build --manifest-path experiments/0104-native-xmp-date-adapter/Cargo.toml --locked --release
      - name: Check bounded read-only privacy coverage research
        run: |
          cargo fmt --manifest-path experiments/0088-privacy-coverage/Cargo.toml --all --check
          cargo clippy --manifest-path experiments/0088-privacy-coverage/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path experiments/0088-privacy-coverage/Cargo.toml --locked
          cargo build --manifest-path experiments/0088-privacy-coverage/Cargo.toml --locked --release --examples
          cargo build --manifest-path experiments/0088-privacy-coverage/Cargo.toml --locked --release
      - name: Check retained-budget and collector tooling syntax
        run: python -m py_compile experiments/0048-native-storage-failures/audit.py experiments/0049-cumulative-budget/supervisor.py experiments/0049-cumulative-budget/qualify.py scripts/read_benchmark.py scripts/test_read_benchmark.py
      - name: Check benchmark collector contracts
        run: |
          python -m pip install jsonschema==4.26.0
          python scripts/test_read_benchmark.py
      - name: Check finite P0 fixture gaps and batch audit controls
        run: |
          python scripts/check_fixture_gaps.py
          python scripts/test_measure_batch_read.py
          python scripts/test_audit_batch_read.py
          python -m py_compile scripts/measure_batch_read.py scripts/qualify_batch_read.py scripts/audit_batch_read.py scripts/check_fixture_gaps.py
      - name: Check single-read evidence verifier
        run: |
          python -m py_compile scripts/measure_single_read.py scripts/audit_read_baseline.py
          python scripts/test_read_baseline.py
      - name: Check named privacy catalog
        run: python scripts/check_privacy_catalog.py
      - name: Check receipt timestamp tooling syntax
        run: python -m py_compile experiments/0100-receipt-timestamps/native.py experiments/0100-receipt-timestamps/qualify.py experiments/0100-receipt-timestamps/audit.py
      - name: Check authored CR3 reference-write accounting
        run: |
          python -m unittest discover -s experiments/0099-cr3-reference-effects -p test_controls.py -v
          python -m py_compile experiments/0099-cr3-reference-effects/qualify_private.py
      - name: Check authored CR3 rewrite attribution
        run: |
          python -m unittest discover -s experiments/0102-cr3-rewrite-attribution -p "test_*.py" -v
          python -m py_compile experiments/0102-cr3-rewrite-attribution/attribute_private.py experiments/0102-cr3-rewrite-attribution/independent_audit.py
      - name: Check process-owned marker transport and lifecycle
        run: |
          python -W error -m unittest discover -s experiments/0103-process-custody -p "test_*.py" -v
          python -m py_compile experiments/0103-process-custody/runtime.py experiments/0103-process-custody/qualify.py experiments/0103-process-custody/audit.py
      - name: Check conditional replacement research
        run: |
          cargo fmt --manifest-path experiments/0093-conditional-replacement/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0093-conditional-replacement/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0093-conditional-replacement/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0093-conditional-replacement/Cargo.toml
      - name: Qualify conditional replacement markers on Windows
        if: runner.os == 'Windows'
        run: python experiments/0093-conditional-replacement/qualify.py --binary experiments/0093-conditional-replacement/target/release/imageinfo-conditional-replacement-probe.exe --parent .local/conditional-replacement-ci --output .local/conditional-replacement-ci.json
      - name: Refuse conditional replacement on unsupported platforms
        if: runner.os != 'Windows'
        run: |
          experiments/0093-conditional-replacement/target/release/imageinfo-conditional-replacement-probe .local/replacement-must-not-exist both-guard > .local/replacement-refusal.json
          python -c "import json; from pathlib import Path; v=json.loads(Path('.local/replacement-refusal.json').read_text()); assert v['refusalCode']=='WINDOWS_ONLY' and not v['renameAttempted'] and not v['renameSucceeded'] and not v['productionReplacementAllowed'] and not v['committed'] and v['enabledProfiles']==0; assert not Path('.local/replacement-must-not-exist').exists()"
      - name: Check exact backend refusal ledger
        run: python experiments/0051-profile-admission/qualify.py --public .local/profile-admission-ci.json
      - name: Check one-way XMP date mapping model
        run: |
          cargo fmt --manifest-path experiments/0083-xmp-date-mapping/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0083-xmp-date-mapping/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0083-xmp-date-mapping/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0083-xmp-date-mapping/Cargo.toml
      - name: Check authored XMP date preservation
        run: |
          cargo fmt --manifest-path experiments/0084-xmp-preservation/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0084-xmp-preservation/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0084-xmp-preservation/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0084-xmp-preservation/Cargo.toml
      - name: Check bound Windows publication formatting
        run: cargo fmt --manifest-path experiments/0032-windows-publication/Cargo.toml --check
      - name: Check existing-source oplock research
        run: |
          cargo fmt --manifest-path experiments/0034-source-oplocks/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0034-source-oplocks/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0034-source-oplocks/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0034-source-oplocks/Cargo.toml
      - name: Check owned staging cleanup research
        run: |
          cargo fmt --manifest-path experiments/0038-staging-cleanup/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0038-staging-cleanup/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0038-staging-cleanup/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0038-staging-cleanup/Cargo.toml
      - name: Check owned output release research
        run: |
          cargo fmt --manifest-path experiments/0039-output-release/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0039-output-release/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0039-output-release/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0039-output-release/Cargo.toml
      - name: Qualify owned output policy release on Windows
        if: runner.os == 'Windows'
        run: python experiments/0039-output-release/qualify.py --binary experiments/0039-output-release/target/release/imageinfo-output-release-probe.exe --parent experiments/0039-output-release/target
      - name: Refuse unsupported output release adapter
        if: runner.os != 'Windows'
        run: python experiments/0039-output-release/qualify.py --binary experiments/0039-output-release/target/release/imageinfo-output-release-probe --parent experiments/0039-output-release/target
      - name: Qualify live owned staging cleanup on Windows
        if: runner.os == 'Windows'
        run: python experiments/0038-staging-cleanup/qualify.py --binary experiments/0038-staging-cleanup/target/release/imageinfo-staging-cleanup-probe.exe --parent experiments/0038-staging-cleanup/target
      - name: Qualify planned staging limits on Windows
        if: runner.os == 'Windows'
        run: python experiments/0040-staging-limits/qualify.py --binary experiments/0038-staging-cleanup/target/release/imageinfo-staging-cleanup-probe.exe --parent experiments/0038-staging-cleanup/target
      - name: Refuse unsupported staging limits adapter
        if: runner.os != 'Windows'
        run: python experiments/0040-staging-limits/qualify.py --binary experiments/0038-staging-cleanup/target/release/imageinfo-staging-cleanup-probe --parent experiments/0038-staging-cleanup/target
      - name: Refuse unsupported staging cleanup adapter
        if: runner.os != 'Windows'
        run: python experiments/0038-staging-cleanup/qualify.py --binary experiments/0038-staging-cleanup/target/release/imageinfo-staging-cleanup-probe --parent experiments/0038-staging-cleanup/target
      - name: Qualify existing-source oplock exclusion on Windows
        if: runner.os == 'Windows'
        run: python experiments/0034-source-oplocks/qualify.py --binary experiments/0034-source-oplocks/target/release/imageinfo-source-oplock-probe.exe --parent experiments/0034-source-oplocks/target
      - name: Refuse source oplocks on unsupported platforms
        if: runner.os != 'Windows'
        run: python experiments/0034-source-oplocks/qualify.py --binary experiments/0034-source-oplocks/target/release/imageinfo-source-oplock-probe --parent experiments/0034-source-oplocks/target
      - name: Check owner-rights research source
        run: |
          cargo fmt --manifest-path experiments/0033-owner-rights/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0033-owner-rights/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0033-owner-rights/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0033-owner-rights/Cargo.toml
      - name: Qualify owner-rights creation and held publication on Windows
        if: runner.os == 'Windows'
        run: python experiments/0033-owner-rights/qualify.py --binary experiments/0033-owner-rights/target/release/imageinfo-owner-rights-probe.exe --parent experiments/0033-owner-rights/target
      - name: Refuse owner-rights qualification on unsupported platforms
        if: runner.os != 'Windows'
        run: python experiments/0033-owner-rights/qualify.py --binary experiments/0033-owner-rights/target/release/imageinfo-owner-rights-probe --parent experiments/0033-owner-rights/target
      - name: Check guest research formatting and lints
        run: |
          cargo fmt --manifest-path experiments/0031-guest-durability/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0031-guest-durability/Cargo.toml --all-targets -- -D warnings
      - name: Test and build guest research
        run: |
          cargo test --locked --manifest-path experiments/0031-guest-durability/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0031-guest-durability/Cargo.toml
      - name: Verify guest profile and repair refusals on Windows
        if: runner.os == 'Windows'
        run: python experiments/0031-guest-durability/qualify.py --binary experiments/0031-guest-durability/target/release/imageinfo-guest-storage-probe.exe --parent experiments/0031-guest-durability/target
      - name: Verify guest research admission refuses on Unix
        if: runner.os != 'Windows'
        run: python experiments/0031-guest-durability/qualify.py --binary experiments/0031-guest-durability/target/release/imageinfo-guest-storage-probe --parent experiments/0031-guest-durability/target
      - name: Check bound Windows publication lints
        run: cargo clippy --locked --manifest-path experiments/0032-windows-publication/Cargo.toml --all-targets -- -D warnings
      - name: Test and build bound publication experiment
        run: |
          cargo test --locked --manifest-path experiments/0032-windows-publication/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0032-windows-publication/Cargo.toml
      - name: Qualify held Windows publication and strict unsupported admission
        if: runner.os == 'Windows'
        run: python experiments/0032-windows-publication/qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe.exe --parent experiments/0032-windows-publication/target
      - name: Inspect interrupted Windows transactions without effects
        if: runner.os == 'Windows'
        run: python experiments/0036-windows-inspection/qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe.exe --parent experiments/0032-windows-publication/target
      - name: Check disposable Windows guest tooling syntax
        run: python -m py_compile experiments/0022-ordinary-output/windows_guest.py experiments/0022-ordinary-output/guest_qualify.py experiments/0022-ordinary-output/guest_audit.py experiments/0022-ordinary-output/guest_actors.py experiments/0022-ordinary-output/persistence_qualify.py experiments/0022-ordinary-output/persistence_audit.py
      - name: Check caller-history guest qualification tooling syntax
        run: python -m py_compile experiments/0044-custody-guest/qualify.py experiments/0044-custody-guest/audit.py
      - name: Check receipt guest qualification tooling syntax
        run: python -m py_compile experiments/0047-receipt-guest/qualify.py experiments/0047-receipt-guest/audit.py
      - name: Qualify ordinary persistence ordering on Windows
        if: runner.os == 'Windows'
        run: python experiments/0022-ordinary-output/persistence_qualify.py native --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe.exe --parent experiments/0032-windows-publication/target
      - name: Check caller-bound restart tooling syntax
        run: python -m py_compile experiments/0022-ordinary-output/restart_qualify.py experiments/0022-ordinary-output/restart_audit.py experiments/0022-ordinary-output/restart_guest.py experiments/0022-ordinary-output/restart_guest_audit.py
      - name: Qualify caller-bound restart marker actions on Windows
        if: runner.os == 'Windows'
        run: python experiments/0022-ordinary-output/restart_qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe.exe --parent experiments/0032-windows-publication/target
      - name: Refuse caller-bound restart adapter on unsupported platforms
        if: runner.os != 'Windows'
        run: python experiments/0022-ordinary-output/restart_qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe --parent experiments/0032-windows-publication/target
      - name: Check caller-history custody tooling syntax
        run: python -m py_compile experiments/0022-ordinary-output/custody_qualify.py experiments/0022-ordinary-output/custody_audit.py
      - name: Qualify guarded caller-history custody on Windows
        if: runner.os == 'Windows'
        run: python experiments/0022-ordinary-output/custody_qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe.exe --parent experiments/0032-windows-publication/target
      - name: Refuse caller-history custody on unsupported platforms
        if: runner.os != 'Windows'
        run: python experiments/0022-ordinary-output/custody_qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe --parent experiments/0032-windows-publication/target
      - name: Check marker receipt qualification tooling syntax
        run: python -m py_compile experiments/0046-namespace-receipt/qualify.py experiments/0046-namespace-receipt/audit.py
      - name: Qualify guarded marker receipts on Windows
        if: runner.os == 'Windows'
        run: python experiments/0046-namespace-receipt/qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe.exe --parent experiments/0032-windows-publication/target
      - name: Refuse marker receipts on unsupported platforms
        if: runner.os != 'Windows'
        run: python experiments/0046-namespace-receipt/qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe --parent experiments/0032-windows-publication/target
      - name: Refuse unsupported ordinary persistence adapter
        if: runner.os != 'Windows'
        run: python experiments/0022-ordinary-output/persistence_qualify.py native --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe --parent experiments/0032-windows-publication/target
      - name: Qualify option A ordinary output on Windows
        if: runner.os == 'Windows'
        run: python experiments/0022-ordinary-output/qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe.exe --parent experiments/0032-windows-publication/target
      - name: Refuse unsupported ordinary output adapter
        if: runner.os != 'Windows'
        run: python experiments/0022-ordinary-output/qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe --parent experiments/0032-windows-publication/target
      - name: Refuse unsupported Windows inspection adapter
        if: runner.os != 'Windows'
        run: python experiments/0036-windows-inspection/qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe --parent experiments/0032-windows-publication/target
      - name: Refuse bound Windows publication on unsupported platforms
        if: runner.os != 'Windows'
        run: python experiments/0032-windows-publication/qualify.py --binary experiments/0032-windows-publication/target/release/imageinfo-windows-publication-probe --parent experiments/0032-windows-publication/target
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check read-only CR3 admission research
        run: |
          cargo fmt --manifest-path experiments/0027-cr3-admission/Cargo.toml --check
          cargo clippy --locked --manifest-path experiments/0027-cr3-admission/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path experiments/0027-cr3-admission/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0027-cr3-admission/Cargo.toml
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test library and executable contracts
        run: cargo test --locked
      - name: Check actual CLI result schemas
        run: python scripts/check_output_schemas.py
      - name: Check exact native read JSON
        run: python scripts/check_native_read_json.py
      - name: Qualify batch collection on authored structural inputs
        shell: bash
        run: |
          binary=target/debug/imageinfo
          if [ "$RUNNER_OS" = "Windows" ]; then binary=target/debug/imageinfo.exe; fi
          python scripts/qualify_batch_read.py --binary "$binary" --source-root . --parent .local/batch-read-ci --output .local/batch-read-ci.json
      - name: Build release executable
        run: cargo build --locked --release
      - name: Check experimental candidate formatting
        run: cargo fmt --manifest-path experiments/0021-cr3-candidate/Cargo.toml --check
      - name: Check experimental candidate lints
        run: cargo clippy --locked --manifest-path experiments/0021-cr3-candidate/Cargo.toml --all-targets -- -D warnings
      - name: Test private-candidate experiment on authored bytes
        run: cargo test --locked --manifest-path experiments/0021-cr3-candidate/Cargo.toml
      - name: Build experimental candidate tools
        run: cargo build --locked --release --manifest-path experiments/0021-cr3-candidate/Cargo.toml
      - name: Probe disposable Windows storage primitives
        if: runner.os == 'Windows'
        run: python experiments/0021-cr3-candidate/storage_probe.py --parent experiments/0021-cr3-candidate/target --guard experiments/0021-cr3-candidate/target/release/source_guard.exe
      - name: Probe disposable Unix storage primitives
        if: runner.os != 'Windows'
        run: python experiments/0021-cr3-candidate/storage_probe.py --parent experiments/0021-cr3-candidate/target
      - name: Check documentation and public JSON
        run: python scripts/check_docs.py
      - name: Check recovery research formatting
        run: cargo fmt --manifest-path experiments/0028-recovery-evidence/Cargo.toml --check
      - name: Check recovery research lints
        run: cargo clippy --locked --manifest-path experiments/0028-recovery-evidence/Cargo.toml --all-targets -- -D warnings
      - name: Test bounded recovery evidence records
        run: cargo test --locked --manifest-path experiments/0028-recovery-evidence/Cargo.toml
      - name: Build recovery research tools
        run: cargo build --locked --release --manifest-path experiments/0028-recovery-evidence/Cargo.toml
      - name: Qualify owned recovery and filesystem cases on Linux
        if: runner.os == 'Linux'
        run: python experiments/0028-recovery-evidence/qualify.py --binary experiments/0028-recovery-evidence/target/release/imageinfo-recovery-probe --parent experiments/0028-recovery-evidence/target
      - name: Qualify Windows backend refusals and directory handle
        if: runner.os == 'Windows'
        run: python experiments/0028-recovery-evidence/qualify.py --binary experiments/0028-recovery-evidence/target/release/imageinfo-recovery-probe.exe --parent experiments/0028-recovery-evidence/target
      - name: Verify unsupported macOS backend refuses before artifacts
        if: runner.os == 'macOS'
        run: python experiments/0028-recovery-evidence/qualify.py --binary experiments/0028-recovery-evidence/target/release/imageinfo-recovery-probe --parent experiments/0028-recovery-evidence/target
      - name: Check object guard formatting
        run: cargo fmt --manifest-path experiments/0029-object-guards/Cargo.toml --check
      - name: Check object guard lints
        run: cargo clippy --locked --manifest-path experiments/0029-object-guards/Cargo.toml --all-targets -- -D warnings
      - name: Test and build object guard probes
        run: |
          cargo test --locked --manifest-path experiments/0029-object-guards/Cargo.toml
          cargo build --locked --release --manifest-path experiments/0029-object-guards/Cargo.toml
      - name: Qualify Windows object sharing and mappings
        if: runner.os == 'Windows'
        run: python experiments/0029-object-guards/qualify.py --binary experiments/0029-object-guards/target/release/imageinfo-object-guard-probe.exe --parent experiments/0029-object-guards/target
      - name: Qualify Linux anonymous stages and leases
        if: runner.os == 'Linux'
        run: python experiments/0029-object-guards/qualify.py --binary experiments/0029-object-guards/target/release/imageinfo-object-guard-probe --parent experiments/0029-object-guards/target
      - name: Verify unsupported object guard platform refuses
        if: runner.os == 'macOS'
        run: python experiments/0029-object-guards/qualify.py --binary experiments/0029-object-guards/target/release/imageinfo-object-guard-probe --parent experiments/0029-object-guards/target
      - name: Qualify Windows private creation and publication boundaries
        if: runner.os == 'Windows'
        run: python experiments/0030-windows-properties/qualify.py --parent experiments/0030-windows-properties/target --guard experiments/0029-object-guards/target/release/imageinfo-object-guard-probe.exe
      - name: Refuse unsupported Windows property qualification platform
        if: runner.os != 'Windows'
        run: python experiments/0030-windows-properties/qualify.py --parent experiments/0030-windows-properties/target
