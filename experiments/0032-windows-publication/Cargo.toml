[package]
name = "imageinfo-windows-publication-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
imageinfo-recovery-probe = { path = "../0028-recovery-evidence" }
serde_json = "=1.0.152"

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
