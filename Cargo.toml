[package]
name = "imageinfo"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Bounded Canon EOS R5 RAW metadata and preview tooling"
repository = "https://github.com/imageinfo/imageinfo"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
same-file = "=1.0.6"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

roxmltree = { version = "=0.21.1", default-features = false, features = ["std", "positions"] }

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(windows)'.dependencies]
imageinfo-windows-storage = { path = "crates/imageinfo-windows-storage" }
