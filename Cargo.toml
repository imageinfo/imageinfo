[package]
name = "imageinfo"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Bounded Canon EOS R5 RAW metadata and preview tooling"
repository = "https://github.com/imageinfo/imageinfo"
publish = false

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[lints.rust]
unsafe_code = "forbid"
